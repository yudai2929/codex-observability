name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Test, lint, format, and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Test
        run: mise run test
      - name: Lint
        run: mise run lint
      - name: Check formatting
        run: mise run fmt-check
      - name: Build
        run: mise run build
      - name: Verify generated dashboard
        run: |
          mise run dashboard
          git diff --exit-code -- grafana/dashboards/codex.json
