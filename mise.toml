[tools]
go = "1.26.5"

[tasks.dashboard]
description = "Generate the Grafana dashboard with the Go SDK"
run = "go run ./cmd/dashboardgen"

[tasks.up]
description = "Start the local Grafana and OpenTelemetry stack"
depends = ["dashboard"]
run = "docker compose up -d"

[tasks.down]
description = "Stop the local Grafana stack"
run = "docker compose down"

[tasks.refresh]
description = "Regenerate the dashboard and restart Grafana"
depends = ["dashboard"]
run = "docker compose restart lgtm"

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.build]
description = "Build the dashboard generator"
run = "go build ./..."

[tasks.lint]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Check Go source formatting"
run = 'test -z "$(gofmt -l .)"'
